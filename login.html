<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - EXACT SaaS</title>
    <!-- Bootstrap untuk kecantikan paparan -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Enjin Supabase JS ditarik terus dari internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-secondary d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Sistem EXACT</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Alamat Emel</label>
                <input type="email" id="email" class="form-control" required placeholder="contoh@universiti.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Kata Laluan</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Log Masuk</button>
        </form>
        
        <!-- Ruangan untuk memaparkan ralat log masuk -->
        <div id="loginMessage" class="mt-3 text-center"></div>
    </div>

    <script>
       // 1. Hubungkan ke Supabase
        const supabaseUrl = 'https://odzsadvbnsvzkhauhass.supabase.co/';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kenNhZHZibnN2emtoYXVoYXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzM5MDksImV4cCI6MjEwMjAwOTkwOX0.tZq4sCq2QOUwaFeWxkTwLAx6hCsLz56e2GuTbcusStM';
        
        // TUKAR NAMA PEMBOLEHUBAH INI KEPADA supabaseClient
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Fungsi apabila butang Log Masuk ditekan
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Elak muka surat refresh

            const msgDiv = document.getElementById('loginMessage');
            msgDiv.innerHTML = '<span class="text-secondary">Sedang menyemak...</span>';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // PASTIKAN ANDA GUNA supabaseClient DI SINI JUGA
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            // 4. Semak keputusan
            if (error) {
                // Jika salah password / emel tiada
                msgDiv.innerHTML = '<span class="text-danger fw-bold">❌ Gagal: ' + error.message + '</span>';
            } else {
                // Jika berjaya log masuk!
                msgDiv.innerHTML = '<span class="text-success fw-bold">✅ Log Masuk Berjaya! Mengalihkan...</span>';
                
                // Simpan token akses di komputer pengguna (seperti pasport)
                localStorage.setItem('exact_token', data.session.access_token);
                
                // Alihkan (Redirect) pengguna ke halaman borang Check-In
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000); // Tunggu 2 saat sebelum beralih
            }
        });
    </script>
</body>
</html>
