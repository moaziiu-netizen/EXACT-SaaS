<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXACT - Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f8; padding-top: 50px; }
    .card-super { max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: #fff; border-top: 5px solid #212529; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-super">
      <h3 class="text-center fw-bold mb-1">EXACT Super-Admin</h3>
      <p class="text-center text-muted mb-4 small">Pendaftaran Pelanggan (Tenant) Baharu</p>

      <form id="tenantForm">
        <div class="mb-3">
          <label class="form-label fw-bold">Nama Penuh Universiti / Institusi</label>
          <input type="text" id="tName" class="form-control" placeholder="Contoh: Universiti Teknologi MARA (UiTM)" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">ID Log Masuk Admin</label>
          <input type="text" id="tUser" class="form-control" placeholder="Contoh: admin_uitm" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Kata Laluan</label>
          <input type="text" id="tPass" class="form-control" placeholder="Contoh: uitm2026" required>
        </div>
        <button type="submit" class="btn btn-dark w-100 fw-bold" id="btnDaftar">Daftar Pelanggan</button>
      </form>
      
      <div id="resultMsg" class="mt-3 text-center fw-bold"></div>
    </div>
  </div>

  <script>
    document.getElementById('tenantForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnDaftar');
      const msg = document.getElementById('resultMsg');
      
      const payload = {
          tenant_name: document.getElementById('tName').value,
          username: document.getElementById('tUser').value,
          password: document.getElementById('tPass').value
      };

      btn.disabled = true; btn.textContent = 'Mendaftarkan...'; msg.innerHTML = '';

      fetch('/api/superadmin/tenant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
          btn.disabled = false; btn.textContent = 'Daftar Pelanggan';
          if(data.success) {
              msg.innerHTML = `<span class="text-success">${data.message}</span>`;
              document.getElementById('tenantForm').reset();
          } else {
              msg.innerHTML = `<span class="text-danger">Ralat: ${data.message}</span>`;
          }
      })
      .catch(err => {
          btn.disabled = false; btn.textContent = 'Daftar Pelanggan';
          msg.innerHTML = `<span class="text-danger">Gagal menghubungi pelayan.</span>`;
      });
    });
  </script>
</body>
</html>
