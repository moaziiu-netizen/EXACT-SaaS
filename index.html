<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem EXACT - Pengawasan Peperiksaan</title>
    <!-- Kita gunakan Bootstrap untuk mencantikkan paparan (sama seperti sistem lama anda) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow" style="max-width: 500px; margin: auto;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Check-In Pengawas Peperiksaan</h4>
            </div>
            <div class="card-body">
                
                <!-- INI ADALAH BORANG KITA -->
                <form id="checkInForm">
                    <div class="mb-3">
                        <label class="form-label">Nama Staf</label>
                        <input type="text" id="staff_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ID Staf</label>
                        <input type="text" id="staff_id" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Venue Peperiksaan</label>
                        <input type="text" id="venue" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Hantar Kehadiran</button>
                </form>

                <!-- Ruangan untuk memaparkan mesej berjaya/gagal -->
                <div id="statusMessage" class="mt-3 text-center"></div>

            </div>
        </div>
    </div>

    <!-- INI ADALAH LOGIK JAVASCRIPT SAAS KITA -->
    <script>
        document.getElementById('checkInForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Mengelakkan muka surat di-refresh

            // 1. Tunjuk mesej memproses
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = '<span class="text-secondary">Sedang menghantar data...</span>';

            // 2. Ambil data dari kotak input
            const tenantId = "c2a6693c-48cc-400b-9baf-ca51dcaef337"; // <-- TUKAR DI SINI
            const staffName = document.getElementById('staff_name').value;
            const staffId = document.getElementById('staff_id').value;
            const examVenue = document.getElementById('venue').value;

            // 3. Hantar data ke Pelayan Node.js (Ganti google.script.run)
            fetch('http://localhost:3000/api/checkin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    tenant_id: tenantId,
                    staff_name: staffName,
                    staff_id: staffId,
                    venue: examVenue
                })
            })
            .then(response => response.json())
            .then(data => {
                // 4. Paparkan keputusan dari pelayan
                if(data.success) {
                    statusDiv.innerHTML = '<span class="text-success fw-bold">✅ ' + data.message + '</span>';
                    document.getElementById('checkInForm').reset(); // Kosongkan borang
                } else {
                    statusDiv.innerHTML = '<span class="text-danger fw-bold">❌ Ralat: ' + data.message + '</span>';
                }
            })
            .catch(error => {
                statusDiv.innerHTML = '<span class="text-danger fw-bold">❌ Gagal berhubung dengan pelayan. Pastikan pelayan dihidupkan.</span>';
            });
        });
    </script>

</body>
</html>
