<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXACT - Super Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #212529; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .login-card { max-width: 400px; width: 90%; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 5px solid #ffc107; }
    .btn-login { background-color: #212529; border-color: #212529; color: white; }
    .btn-login:hover { background-color: #424649; color: white; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold">EXACT Super-Admin</h3>
        <p class="text-muted small">Ruang Kawalan Utama</p>
    </div>
    
    <div id="errorMsg" class="text-danger text-center mb-3 fw-bold small"></div>
    
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-bold">ID Pengguna</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan ID Super-Admin" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">Kata Laluan</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan Kata Laluan" required>
      </div>
      <button type="submit" class="btn btn-login w-100 fw-bold py-2" id="btnLogin">Log Masuk</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="index.html" class="text-decoration-none small text-muted">Kembali ke Halaman Utama</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true; btn.textContent = 'Mengesahkan...'; document.getElementById('errorMsg').innerText = '';

      fetch('/api/superadmin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false; btn.textContent = 'Log Masuk';
        if(data.success) {
            // Simpan token khas Super-Admin di memori pelayar
            sessionStorage.setItem('superAdminToken', data.token);
            window.location.href = 'superadmin.html';
        } else {
            document.getElementById('errorMsg').innerText = data.message;
        }
      })
      .catch(err => {
        btn.disabled = false; btn.textContent = 'Log Masuk';
        document.getElementById('errorMsg').innerText = 'Gagal menghubungi pelayan.';
      });
    });
  </script>
</body>
</html>
